server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # nginx mime.types känner inte till .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service workern måste kunna bytas ut direkt, annars fastnar klienter
    # på en gammal version av appskalet.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Frågebanken byggs om vid behov — låt klienten revalidera.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Bilder och filmer är namngivna efter innehållet och ändras aldrig.
    location /media/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
